name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Lint
        run: |
          ruff check src tests
          black --check src tests

      - name: Type check
        run: |
          mypy src

      - name: Run tests
        # Settings requires an API key, deliberately: a deployment missing
        # one should fail loudly at startup rather than at the provider.
        # Every test mocks its LLM and network calls, so this value is
        # never used to reach anything.
        env:
          OPENROUTER_API_KEY: ci-not-a-real-key
        run: |
          pytest

      - name: Docker build (deployed image)
        # The root Dockerfile bakes a HuggingFace model download + apt build
        # deps at build time — too slow to run on every PR. Build it only on
        # pushes to main, where a slow/broken image build still gets caught.
        if: github.event_name == 'push'
        run: |
          docker build -f Dockerfile -t finsight-ai .